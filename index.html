<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="logo">
            MY STORE
        </div>

        <nav>

            <a href="#home">
                videos
            </a>

            <a href="#products">
                Ladies
            </a>

        </nav>

    </header>




    <!-- PRODUCTS -->

    <section
        id="products"
        class="products-section"
    >

        <!-- FIRST ROW -->

        <div class="section-heading">


            <h2>
                Available Now
            </h2>

            <p>
                Scroll horizontally to see more products.
            </p>

        </div>


        <div
            id="productContainer"
            class="product-row"
        ></div>


        <!-- SECOND ROW -->

        <div class="section-heading second-row-heading">

            <p class="small-title">
                MORE PRODUCTS
            </p>

            <h2>
                Videos
            </h2>

        </div>


        <div
            id="featuredProductContainer"
            class="product-row featured-row"
        ></div>

    </section>


    <!-- PURCHASE SUMMARY -->

    <section
        id="summarySection"
        class="summary-section hidden"
    >

        <div class="summary-card">

            <p class="small-title">
                PAYMENT CONFIRMED
            </p>

            <h2>
                Purchase Summary
            </h2>

            <div id="purchaseSummary"></div>

        </div>

    </section>


    <!-- IMAGE PREVIEW CONTAINER -->

    <div
        id="imagePreview"
        class="image-preview hidden"
    >

        <span
            id="closePreview"
            class="close-preview"
        >
            ×
        </span>

        <img
            id="previewImage"
            src=""
            alt="Product preview"
        >

    </div>


    <!-- LENCO -->

    <script src="https://pay.lenco.co/js/v1/inline.js"></script>

    <!-- WEBSITE JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
