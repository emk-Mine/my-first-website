<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Style Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">NETFLIX</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home" class="hero">
        <div class="hero-content">
            <p class="small-title">WELCOME</p>

            <h1>Unlimited Entertainment</h1>

            <p>
                Welcome to my Netflix-inspired website.
                Explore movies, shows and entertainment.
            </p>

            <button id="contactButton">Get Started</button>
        </div>
    </main>

    <section id="about" class="section">
        <h2>About</h2>
        <p>
            This is my first Netflix-inspired website built with
            HTML, CSS and JavaScript.
        </p>
    </section>

    <section id="contact" class="section">
        <h2>Contact</h2>
        <p>Thanks for visiting my website.</p>
    </section>

    <script src="script.js"></script>

</body>
</html>
