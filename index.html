<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">MY STORE</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
        </nav>

    </header>



    <!-- Products -->
    <section id="products" class="products-section">

        <div class="section-heading">

            <h2>
                Available Now
            </h2>

            <p>
                Scroll horizontally to see more products.
            </p>

        </div>


        <!-- Products are inserted here by JavaScript -->
        <div id="productContainer" class="product-row"></div>

    </section>


    <!-- Purchase Summary -->
    <section id="summarySection" class="summary-section hidden">

        <div class="summary-card">

            <p class="small-title">
                PAYMENT CONFIRMED
            </p>

            <h2>
                Purchase Summary
            </h2>

            <div id="purchaseSummary"></div>

        </div>

    </section>


    <!-- Lenco -->
    <script src="https://pay.lenco.co/js/v1/inline.js"></script>

    <!-- Website JavaScript -->
    <script src="script.js"></script>

</body>
</html>
