<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title> Bakulu </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="logo">
            BAKULU
        </div>

        <nav>
            <a href="#videos">videos</a>
            <a href="#ladies">ladies</a>
        </nav>

    </header>




    <!-- PRODUCTS -->

    <section
        id="ladies"
        class="products-section"
    >

        <!-- FIRST ROW -->

        <div class="section-heading">


            <h2>
                Available Now
            </h2>

            <p>
                Scroll horizontally to see more products.
            </p>

        </div>


        <div
            id="productContainer"
            class="product-row"
        ></div>


        <!-- SECOND ROW -->

        <div class="section-heading second-row-heading">

            <p class="small-title">
                TRENDING VIDEOS
            </p>

            <h2>
                Videos
            </h2>

        </div>


        <div
            id="featuredProductContainer"
            class="product-row featured-row"
        ></div>

    </section>


    <!-- PURCHASE SUMMARY -->

    <section
        id="summarySection"
        class="summary-section hidden"
    >

        <div class="summary-card">

            <p class="small-title">
                PAYMENT CONFIRMED
            </p>

            <h2>
                Purchase Summary
            </h2>

            <div id="purchaseSummary"></div>

        </div>

    </section>


    <!-- IMAGE PREVIEW -->

    <div
        id="imagePreview"
        class="image-preview hidden"
    >

        <span
            id="closePreview"
            class="close-preview"
        >
            ×
        </span>

        <img
            id="previewImage"
            src=""
            alt="Product preview"
        >

    </div>


    <!-- PAYMENT DETAILS MODAL -->

    <div
        id="paymentModal"
        class="payment-modal hidden"
    >

        <div class="payment-card">

            <button
                type="button"
                id="closePaymentModal"
                class="modal-close"
            >
                ×
            </button>


            <p class="small-title">
                CHECKOUT
            </p>


            <h2>
                Payment Details
            </h2>


            <p class="payment-subtitle">
                Enter your details before continuing to payment.
            </p>


            <!-- PRODUCT -->

            <div class="checkout-product">

                <div>

                    <span class="checkout-label">
                        Product
                    </span>

                    <strong id="checkoutProductName">
                        Product
                    </strong>

                </div>


                <strong id="checkoutProductPrice">
                    K0
                </strong>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="customerEmail">
                    Email address
                </label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

                <small>
                    Used for your payment transaction.
                </small>

            </div>


            <!-- CONTINUE -->

            <button
                type="button"
                id="continuePaymentButton"
                class="continue-payment-button"
            >
                Continue to Payment
            </button>


            <button
                type="button"
                id="cancelPaymentButton"
                class="cancel-payment-button"
            >
                Cancel
            </button>

        </div>

    </div>


    <!-- LENCO -->

    <script src="https://pay.lenco.co/js/v1/inline.js"></script>

    <!-- WEBSITE JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
